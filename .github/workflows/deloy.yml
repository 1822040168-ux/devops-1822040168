name: Auto Deploy Website

# Tự động chạy mỗi khi có code mới được push lên nhánh main
on:
  push:
    branches:
      - main

# Cấp quyền để GitHub Actions được phép xuất bản trang web
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # Job 1: Kiểm tra điều kiện code trước khi deploy
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Tải code về máy chủ chạy Action
        uses: actions/checkout@v4

      - name: Kiểm tra đủ 3 file bắt buộc
        run: |
          if [ ! -f "index.html" ] || [ ! -f "style.css" ] || [ ! -f "script.js" ]; then
            echo "Lỗi: Thiếu 1 trong 3 file index.html, style.css, script.js!"
            exit 1
          fi
          echo "Thành công: Đã có đủ 3 file."

      - name: Kiểm tra thẻ <title> trong index.html
        run: |
          if ! grep -q "<title>.*</title>" index.html; then
            echo "Lỗi: File index.html thiếu thẻ <title>!"
            exit 1
          fi
          echo "Thành công: Đã có thẻ <title>."

  # Job 2: Tự động Deploy lên GitHub Pages (chỉ chạy khi Job check thành công)
  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Tải code về máy chủ chạy Action
        uses: actions/checkout@v4

      - name: Cấu hình GitHub Pages
        uses: actions/configure-pages@v5

      - name: Đóng gói toàn bộ website
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Xuất bản lên GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4